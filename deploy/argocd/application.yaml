apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chess
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: commonroom=ghcr.io/htharshtripathi2012-code/chess:latest
    argocd-image-updater.argoproj.io/commonroom.update-strategy: digest
    argocd-image-updater.argoproj.io/commonroom.kustomize.image-name: ghcr.io/htharshtripathi2012-code/chess
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/htharshtripathi2012-code/chess.git
    targetRevision: main
    path: deploy/k8s/overlays/k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: commonroom
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
