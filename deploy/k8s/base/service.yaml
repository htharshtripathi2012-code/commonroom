apiVersion: v1
kind: Service
metadata:
  name: commonroom
  namespace: commonroom
  labels:
    app.kubernetes.io/name: commonroom
    app.kubernetes.io/part-of: commonroom
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: commonroom
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
