apiVersion: apps/v1
kind: Deployment
metadata:
  name: commonroom
  namespace: commonroom
  labels:
    app.kubernetes.io/name: commonroom
    app.kubernetes.io/part-of: commonroom
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: commonroom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: commonroom
        app.kubernetes.io/part-of: commonroom
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: commonroom
          image: ghcr.io/htharshtripathi2012-code/chess:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: CHAT_BIND_HOST
              value: 0.0.0.0
            - name: CHAT_PORT
              value: "8000"
            - name: CHAT_OPEN_BROWSER
              value: "false"
            - name: CHAT_DB_PATH
              value: /data/commonroom.sqlite3
            - name: CHAT_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: commonroom-admin
                  key: username
                  optional: true
            - name: CHAT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commonroom-admin
                  key: password
                  optional: true
            - name: CHAT_TRUST_PROXY
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: commonroom-data
