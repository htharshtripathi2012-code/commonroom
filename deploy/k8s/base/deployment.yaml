apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess
  namespace: chess
  labels:
    app.kubernetes.io/name: chess
    app.kubernetes.io/part-of: chess
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chess
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chess
        app.kubernetes.io/part-of: chess
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chess
          image: ghcr.io/htharshtripathi2012-code/chess:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: CHESS_BIND_HOST
              value: 0.0.0.0
            - name: CHESS_PORT
              value: "8000"
            - name: CHESS_OPEN_BROWSER
              value: "false"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
