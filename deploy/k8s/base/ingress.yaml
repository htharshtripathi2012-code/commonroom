apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: commonroom
  namespace: commonroom
  labels:
    app.kubernetes.io/name: commonroom
    app.kubernetes.io/part-of: commonroom
spec:
  rules:
    - host: ""
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: commonroom
                port:
                  number: 80
