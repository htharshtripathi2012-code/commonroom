apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chess
  namespace: chess
  labels:
    app.kubernetes.io/name: chess
    app.kubernetes.io/part-of: chess
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chess
                port:
                  name: http
